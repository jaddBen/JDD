<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JDD Fit">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="JDD Fitness — workouts, food, calories, and Apple Health sync">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>JDD Fitness</title>
</head>
<body>
  <div id="app">
    <header class="app-header" id="appHeader">
      <div class="header-left">
        <span class="brand">JDD<span class="brand-accent">FIT</span></span>
      </div>
      <div class="header-right" id="dateLabel"></div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-route="dashboard">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-route="workout">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M20.57 14.86 22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.14 4.57 3.71 3.14 2 5.71l.71.71L2 7.14 3.43 8.57l1.43-1.43L13.57 16l-1.43 1.43L13.57 19l1.43-1.43L16.57 19 19 16.57l-1.43-1.43z" fill="currentColor"/></svg>
        <span>Workout</span>
      </button>
      <button class="tab" data-route="food">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z" fill="currentColor"/></svg>
        <span>Food</span>
      </button>
      <button class="tab" data-route="stats">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 9.2h3V19H5zM10.6 5h3v14h-3zM16.2 13h3v6h-3z" fill="currentColor"/></svg>
        <span>Stats</span>
      </button>
      <button class="tab" data-route="settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.26.91c-.48-.36-1-.67-1.56-.91l-.34-2.4a.488.488 0 0 0-.48-.41h-3.84a.488.488 0 0 0-.48.41l-.34 2.4c-.56.24-1.08.55-1.56.91l-2.26-.91a.488.488 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94 0 .32.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.13.22.37.29.59.22l2.26-.91c.48.36 1 .67 1.56.91l.34 2.4c.05.24.24.41.48.41h3.84c.24 0 .43-.17.48-.41l.34-2.4c.56-.24 1.08-.55 1.56-.91l2.26.91c.22.08.46.01.59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 0 1 8.4 12 3.6 3.6 0 0 1 12 8.4a3.6 3.6 0 0 1 3.6 3.6 3.6 3.6 0 0 1-3.6 3.6z" fill="currentColor"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <script src="js/foods.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calories.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
